<!DOCTYPE html>
<html lang="fr" translate="no" class="notranslate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fb">
    <title>SolRush — Administration</title>

    <!-- Never indexed, never followed, never cached by a crawler. A panel that
         shows player emails and payment records has no business in a search
         result, and robots.txt alone is a request rather than an instruction. -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="google" content="notranslate">

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">

    <!-- Self-contained, like the rules pages: the game's stylesheet is built
         around the game's own markup and carries the whole board with it.

         The palette is deliberately NOT the game's. The game is a toy and is
         coloured like one; this is a page for reading numbers off, and what
         makes numbers readable is that almost nothing else competes for
         attention. One accent, hairline borders, no gradients. -->
    <style>
        :root {
            --bg: #f7f8fb;
            --panel: #ffffff;
            --side: #fbfcfe;
            --line: #e6e9f2;
            --line-soft: #eff1f7;
            --text: #0f1320;
            --muted: #666e88;
            --faint: #98a0b6;
            --accent: #2f6df6;
            --accent-soft: rgba(47, 109, 246, .1);
            --up: #12a06a;
            --up-soft: rgba(18, 160, 106, .12);
            --down: #d34550;
            --down-soft: rgba(211, 69, 80, .1);
            --warn: #b8791a;
            --warn-soft: rgba(184, 121, 26, .13);
            --gold: #8f6d10;
            --gold-soft: rgba(224, 182, 74, .2);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b0d13;
                --panel: #14171f;
                --side: #101319;
                --line: #232838;
                --line-soft: #1b1f2b;
                --text: #eef0f7;
                --muted: #8d95ad;
                --faint: #666e8a;
                --accent: #6f9bff;
                --accent-soft: rgba(111, 155, 255, .15);
                --up: #35c98d;
                --up-soft: rgba(53, 201, 141, .14);
                --down: #f0737d;
                --down-soft: rgba(240, 115, 125, .13);
                --warn: #e0a13a;
                --warn-soft: rgba(224, 161, 58, .14);
                --gold: #e0b64a;
                --gold-soft: rgba(224, 182, 74, .14);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0b0d13;
            --panel: #14171f;
            --side: #101319;
            --line: #232838;
            --line-soft: #1b1f2b;
            --text: #eef0f7;
            --muted: #8d95ad;
            --faint: #666e8a;
            --accent: #6f9bff;
            --accent-soft: rgba(111, 155, 255, .15);
            --up: #35c98d;
            --up-soft: rgba(53, 201, 141, .14);
            --down: #f0737d;
            --down-soft: rgba(240, 115, 125, .13);
            --warn: #e0a13a;
            --warn-soft: rgba(224, 161, 58, .14);
            --gold: #e0b64a;
            --gold-soft: rgba(224, 182, 74, .14);
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Every figure here is read by comparing it with the one above it, and
           proportional digits make columns of numbers wobble. */
        .num,
        .big,
        td,
        th,
        .tile b {
            font-variant-numeric: tabular-nums;
        }

        svg.i {
            width: 18px;
            height: 18px;
            flex: none;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ================= frame ================= */
        .app {
            display: flex;
            min-height: 100vh;
        }

        .side {
            width: 232px;
            flex: none;
            background: var(--side);
            border-inline-end: 1px solid var(--line);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -.015em;
            padding: 4px 10px 14px;
        }

        .brand span {
            color: var(--faint);
            font-weight: 500;
        }

        .side nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .side nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: start;
            border: 0;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: .9rem;
            font-weight: 550;
            padding: 9px 10px;
            border-radius: 9px;
            cursor: pointer;
        }

        .side nav button:hover {
            background: var(--line-soft);
            color: var(--text);
        }

        .side nav button[aria-current="page"] {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 650;
        }

        .side nav .tag {
            margin-inline-start: auto;
            font-size: .72rem;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 999px;
            background: var(--up-soft);
            color: var(--up);
        }

        .side-foot {
            margin-top: auto;
            padding: 10px;
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 4;
            /* This bar is a stacking context whatever we do, because
               `position: sticky` creates one on its own — unlike relative or
               absolute, and with or without a z-index. Anything rendered INSIDE
               it is therefore trapped in this layer no matter how large its own
               z-index is.

               The period panel used to live in here. Its z-index of 30 was
               really "30, inside a layer at 4", so the scrim at 25 painted on
               top of it: the panel looked dimmed, and every tap on it hit the
               scrim and shut it. It worked perfectly for a script calling
               .click(), which dispatches straight at an element and never asks
               what is covering it, and was unusable with a finger.

               The panel is moved to <body> while it is open. Nothing that has
               to escape this bar can be a child of it. */
            /* Opaque, and NOT frosted.

               backdrop-filter was here and it was pretty, but an element with
               one becomes the containing block for every position:fixed
               descendant. The period sheet lives in this bar, so on a phone it
               anchored to the bottom of the HEADER instead of the bottom of the
               screen and floated in the middle of the page. A blur is not worth
               a control that lands in the wrong place — and a solid bar over
               scrolling numbers is easier to read anyway. */
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top h1 {
            font-size: 1.02rem;
            margin: 0;
            font-weight: 650;
            letter-spacing: -.01em;
        }

        .top .when {
            font-size: .78rem;
            color: var(--faint);
            white-space: nowrap;
        }

        .tools {
            margin-inline-start: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .burger {
            display: none;
        }

        .view {
            padding: 20px;
            max-width: 1180px;
            width: 100%;
        }

        .scrim {
            display: none;
        }

        /* ---------- phone: the sidebar becomes a drawer ---------- */
        @media (max-width: 900px) {
            .side {
                position: fixed;
                inset-block: 0;
                inset-inline-start: 0;
                z-index: 20;
                transform: translateX(-105%);
                transition: transform .22s cubic-bezier(.2, .8, .3, 1);
                box-shadow: 0 0 40px rgba(0, 0, 0, .25);
            }

            html[dir="rtl"] .side {
                transform: translateX(105%);
            }

            body.open .side {
                transform: none;
            }

            .scrim {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 15;
                background: rgba(8, 10, 16, .45);
                opacity: 0;
                pointer-events: none;
                transition: opacity .22s ease;
            }

            body.open .scrim {
                opacity: 1;
                pointer-events: auto;
            }

            .burger {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 7px;
            }

            .view {
                padding: 16px 14px calc(40px + env(safe-area-inset-bottom, 0px));
            }

            .top {
                padding: 10px 14px;
            }

            /* The toolbar is one trigger and one refresh button now, so it
               drops to its own line under the title rather than squeezing in
               beside it. */
            .tools {
                width: 100%;
                margin-inline-start: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .side,
            .scrim {
                transition: none;
            }
        }

        /* ================= controls ================= */
        button {
            font: inherit;
            cursor: pointer;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            padding: 7px 12px;
            font-size: .84rem;
            font-weight: 600;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.solid {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        button.solid:hover:not(:disabled) {
            color: #fff;
            filter: brightness(1.07);
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        /* ---------- the period picker ----------

           This was a row of six buttons, which is the shape you reach for
           first and the wrong one here. Six is already too many to scan, it
           filled a phone's whole width on its own, the custom range needed a
           SECOND row that appeared and shifted everything below it, and after
           all that the thing you most want to read — which dates am I actually
           looking at — was nowhere on screen.

           One button that states the answer, and a panel that offers the
           alternatives with their dates spelled out. On a phone the panel
           comes up from the bottom, where a thumb is. */
        .picker {
            position: relative;
        }

        .range-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 7px 11px;
        }

        .range-btn .range-name {
            font-weight: 650;
        }

        .range-btn .range-dates {
            color: var(--muted);
            font-weight: 500;
            border-inline-start: 1px solid var(--line);
            padding-inline-start: 9px;
        }

        .range-btn .chev {
            width: 15px;
            height: 15px;
            color: var(--faint);
            transition: transform .18s ease;
        }

        .range-btn[aria-expanded="true"] .chev {
            transform: rotate(180deg);
        }

        .range-btn[aria-expanded="true"] {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Fixed, and positioned from script, because it is moved to <body>
           while open — see the note on .top. Anchoring it to the trigger with
           CSS alone would mean keeping it inside the bar it has to escape. */
        .pop {
            position: fixed;
            z-index: 30;
            width: 302px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(10, 14, 25, .16), 0 2px 6px rgba(10, 14, 25, .06);
            padding: 6px;
            animation: pop .16s cubic-bezier(.2, .8, .3, 1);
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
        }

        .pop-head {
            font-size: .68rem;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: var(--faint);
            font-weight: 700;
            padding: 8px 10px 6px;
        }

        .pop .opt {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: start;
            border: 0;
            background: transparent;
            border-radius: 9px;
            padding: 8px 10px;
            font-size: .88rem;
            font-weight: 550;
            color: var(--text);
        }

        .pop .opt:hover {
            background: var(--line-soft);
            color: var(--text);
        }

        .pop .opt small {
            margin-inline-start: auto;
            color: var(--faint);
            font-weight: 500;
            font-size: .76rem;
            white-space: nowrap;
        }

        .pop .opt .i {
            width: 15px;
            height: 15px;
            color: var(--accent);
            opacity: 0;
        }

        .pop .opt[aria-pressed="true"] {
            color: var(--accent);
            font-weight: 700;
        }

        .pop .opt[aria-pressed="true"] .i {
            opacity: 1;
        }

        .pop-sep {
            height: 1px;
            background: var(--line);
            margin: 6px 4px;
        }

        .pop-custom {
            padding: 2px 10px 10px;
            display: grid;
            gap: 8px;
        }

        .pop-custom label {
            display: grid;
            grid-template-columns: 34px 1fr;
            align-items: center;
            gap: 8px;
            font-size: .8rem;
            color: var(--muted);
        }

        .pop-custom input {
            width: 100%;
        }

        .pop-custom button {
            width: 100%;
            margin-top: 2px;
        }

        .pop-scrim {
            position: fixed;
            inset: 0;
            z-index: 25;
        }

        /* On a phone it is a sheet, not a dropdown: anchored to the bottom,
           full width, within reach. */
        @media (max-width: 700px) {
            .pop {
                position: fixed;
                inset: auto 0 0 0;
                width: auto;
                border-radius: 18px 18px 0 0;
                padding: 6px 6px calc(14px + env(safe-area-inset-bottom, 0px));
                animation: sheet .2s cubic-bezier(.2, .8, .3, 1);
            }

            .pop-scrim {
                background: rgba(8, 10, 16, .35);
            }

            .pop .opt {
                padding: 12px 12px;
                font-size: .95rem;
            }

            .range-btn .range-dates {
                display: none;
            }
        }

        @keyframes sheet {
            from {
                transform: translateY(100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pop {
                animation: none;
            }
        }

        .seg {
            display: inline-flex;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
        }

        .seg button {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: .8rem;
        }

        .seg button:hover:not(:disabled) {
            color: var(--text);
        }

        .seg button[aria-pressed="true"] {
            background: var(--panel);
            color: var(--text);
            box-shadow: 0 1px 2px rgba(15, 19, 32, .08);
        }

        input,
        select {
            font: inherit;
            padding: 8px 11px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            font-size: .86rem;
        }

        input:focus,
        select:focus {
            outline: 2px solid var(--accent-soft);
            border-color: var(--accent);
        }

        input.grow {
            flex: 1;
            min-width: 0;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        a.quiet {
            color: var(--muted);
            font-weight: 500;
            font-size: .85rem;
        }

        a.quiet:hover {
            color: var(--text);
        }

        /* ================= blocks ================= */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px 18px;
        }

        section {
            margin: 0 0 22px;
        }

        .sec-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0 0 11px;
        }

        .sec-head h2 {
            font-size: .72rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--faint);
            font-weight: 700;
        }

        .sec-head .note {
            font-size: .78rem;
            color: var(--faint);
            margin-inline-start: auto;
        }

        /* ---------- the headline figure ---------- */
        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
            padding: 0;
            overflow: hidden;
        }

        .hero-main {
            padding: 20px;
        }

        .cap {
            font-size: .72rem;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .09em;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .big {
            font-size: clamp(1.9rem, 6vw, 2.7rem);
            font-weight: 700;
            letter-spacing: -.035em;
            line-height: 1.04;
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .big i {
            font-style: normal;
            font-size: .38em;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0;
        }

        .hero-side {
            border-inline-start: 1px solid var(--line-soft);
            display: grid;
        }

        .hero-side div {
            padding: 13px 18px;
            display: flex;
            align-items: baseline;
            gap: 9px;
        }

        .hero-side div+div {
            border-top: 1px solid var(--line-soft);
        }

        .hero-side b {
            font-size: 1.05rem;
        }

        .hero-side small {
            color: var(--muted);
            font-size: .79rem;
        }

        @media (max-width: 700px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-side {
                border-inline-start: 0;
                border-top: 1px solid var(--line-soft);
                grid-template-columns: 1fr 1fr;
            }

            .hero-side div {
                flex-direction: column;
                align-items: flex-start;
                gap: 1px;
                padding: 12px 14px;
            }

            .hero-side div+div {
                border-top: 0;
                border-inline-start: 1px solid var(--line-soft);
            }
        }

        /* ---------- change against the previous window ---------- */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: .74rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
            letter-spacing: 0;
        }

        .chip.up {
            background: var(--up-soft);
            color: var(--up);
        }

        .chip.down {
            background: var(--down-soft);
            color: var(--down);
        }

        .chip.flat {
            background: var(--line-soft);
            color: var(--faint);
        }

        /* ---------- tiles ---------- */
        .tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        @media (min-width: 780px) {
            .tiles.by4 {
                grid-template-columns: repeat(4, 1fr);
            }

            .tiles.by3 {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .tile {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 13px 14px;
        }

        .tile b {
            display: block;
            font-size: 1.42rem;
            font-weight: 700;
            letter-spacing: -.022em;
            line-height: 1.15;
        }

        .tile .lab {
            font-size: .78rem;
            color: var(--muted);
        }

        .tile em {
            font-style: normal;
            display: block;
            font-size: .72rem;
            color: var(--faint);
            margin-top: 3px;
        }

        .tile .chip {
            margin-top: 6px;
        }

        .tile.alert {
            border-color: color-mix(in srgb, var(--warn) 50%, var(--line));
        }

        .tile.alert b {
            color: var(--warn);
        }

        /* ---------- chart ---------- */
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 148px;
        }

        .col {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            align-items: flex-end;
            padding: 0 1px;
        }

        .col i {
            display: block;
            width: 100%;
            background: var(--accent);
            border-radius: 4px 4px 2px 2px;
            min-height: 2px;
        }

        .col.zero i {
            background: var(--line);
        }

        .col.last i {
            background: color-mix(in srgb, var(--accent) 70%, #fff);
            outline: 1.5px solid var(--accent);
        }

        .x-axis {
            display: flex;
            gap: 2px;
            margin-top: 8px;
        }

        .x-axis span {
            flex: 1;
            min-width: 0;
            text-align: center;
            font-size: .66rem;
            color: var(--faint);
            white-space: nowrap;
            overflow: hidden;
        }

        .y-top {
            font-size: .7rem;
            color: var(--faint);
            border-bottom: 1px dashed var(--line);
            padding-bottom: 2px;
            margin-bottom: 6px;
        }

        /* ---------- tables ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .88rem;
        }

        th {
            text-align: start;
            font-size: .69rem;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--faint);
            padding: 0 10px 8px 0;
            font-weight: 700;
        }

        td {
            padding: 10px 10px 10px 0;
            border-top: 1px solid var(--line-soft);
            vertical-align: middle;
        }

        tbody tr:first-child td {
            border-top: 0;
        }

        td:last-child,
        th:last-child {
            padding-inline-end: 0;
            text-align: end;
        }

        .who {
            font-weight: 650;
        }

        .sub {
            color: var(--muted);
            font-size: .8rem;
            word-break: break-word;
        }

        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .pill.ok {
            background: var(--up-soft);
            color: var(--up);
        }

        .pill.wait {
            background: var(--warn-soft);
            color: var(--warn);
        }

        .pill.no {
            background: var(--down-soft);
            color: var(--down);
        }

        .pill.plus {
            background: var(--gold-soft);
            color: var(--gold);
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-inline-end: 7px;
            background: var(--up);
            vertical-align: middle;
        }

        .dot.away {
            background: var(--faint);
        }

        .beat {
            animation: none;
        }

        @media (prefers-reduced-motion: no-preference) {
            .beat {
                animation: beat 2.4s ease-in-out infinite;
            }
        }

        @keyframes beat {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .3;
            }
        }

        .empty {
            color: var(--faint);
            font-size: .87rem;
            padding: 6px 0;
            margin: 0;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .more {
            margin-top: 12px;
            text-align: center;
        }

        .gate {
            max-width: 440px;
            margin: 14vh auto;
            text-align: center;
        }

        /* ---------- skeletons ----------

           Shaped like the thing that is coming, not like a spinner. The page
           used to blank to a single "…" on every reload, so switching range
           threw the whole layout away and built it again a moment later —
           three jumps for one click. A skeleton of the right shape means
           nothing moves when the data lands; the grey simply becomes text. */
        .sk {
            background: var(--line-soft);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .sk::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent,
                    color-mix(in srgb, var(--panel) 70%, transparent), transparent);
            animation: shimmer 1.25s ease-in-out infinite;
        }

        html[dir="rtl"] .sk::after {
            animation-direction: reverse;
        }

        @keyframes shimmer {
            to {
                transform: translateX(100%);
            }
        }

        /* Reduced motion keeps the shape and drops the sweep — the layout is
           the useful part, the animation is decoration. */
        @media (prefers-reduced-motion: reduce) {
            .sk::after {
                animation: none;
            }
        }

        .skel .card,
        .skel .tile {
            /* nothing to read yet, so nothing to lift off the page */
            box-shadow: none;
        }

        .sk-line+.sk-line {
            margin-top: 7px;
        }

        .sk-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 148px;
        }

        .sk-bars .sk {
            flex: 1;
            border-radius: 4px 4px 2px 2px;
        }

        .sk-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 0;
            border-top: 1px solid var(--line-soft);
        }

        .sk-row:first-child {
            border-top: 0;
        }

        .sk-row .grow {
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 700px) {

            /* One row becomes one block. The header cells go and each value
               carries its own label — a payment row read one thumb-width at a
               time is a payment row nobody reads. */
            table,
            tbody,
            tr,
            td {
                display: block;
                width: 100%;
            }

            thead {
                display: none;
            }

            tbody tr {
                border-top: 1px solid var(--line-soft);
                padding: 12px 0 10px;
            }

            tbody tr:first-child {
                border-top: 0;
                padding-top: 2px;
            }

            td {
                border: 0;
                padding: 2px 0;
            }

            td:last-child {
                text-align: start;
                padding-top: 9px;
            }

            td[data-label]::before {
                content: attr(data-label) " ";
                color: var(--faint);
                font-size: .69rem;
                text-transform: uppercase;
                letter-spacing: .06em;
                font-weight: 700;
            }
        }
    </style>
</head>

<body>
    <!-- One sprite, six icons, no network request. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="ic-overview" viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="2" />
                <rect x="14" y="3" width="7" height="7" rx="2" />
                <rect x="3" y="14" width="7" height="7" rx="2" />
                <rect x="14" y="14" width="7" height="7" rx="2" />
            </symbol>
            <symbol id="ic-revenue" viewBox="0 0 24 24">
                <ellipse cx="12" cy="6" rx="8" ry="3" />
                <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6" />
                <path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
            </symbol>
            <symbol id="ic-players" viewBox="0 0 24 24">
                <circle cx="9" cy="8" r="3.4" />
                <path d="M2.5 20a6.5 6.5 0 0 1 13 0" />
                <path d="M16 5.3a3.4 3.4 0 0 1 0 6.5M17.5 14.4a6.5 6.5 0 0 1 4 5.6" />
            </symbol>
            <symbol id="ic-matches" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
            </symbol>
            <symbol id="ic-time" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5.2l3.4 2" />
            </symbol>
            <symbol id="ic-live" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="2.6" />
                <path d="M7.7 7.7a6 6 0 0 0 0 8.6M16.3 16.3a6 6 0 0 0 0-8.6" />
                <path d="M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 19.4a10.5 10.5 0 0 0 0-14.8" />
            </symbol>
            <symbol id="ic-menu" viewBox="0 0 24 24">
                <path d="M4 7h16M4 12h16M4 17h16" />
            </symbol>
            <symbol id="ic-refresh" viewBox="0 0 24 24">
                <path d="M20 12a8 8 0 1 1-2.6-5.9" />
                <path d="M20 4v4.5h-4.5" />
            </symbol>
            <symbol id="ic-cal" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="16" rx="3" />
                <path d="M3 10h18M8 3v4M16 3v4" />
            </symbol>
            <symbol id="ic-chev" viewBox="0 0 24 24">
                <path d="M6 9.5 12 15.5 18 9.5" />
            </symbol>
            <symbol id="ic-check" viewBox="0 0 24 24">
                <path d="M4.5 12.5 9.5 17.5 19.5 6.5" />
            </symbol>
        </defs>
    </svg>

    <div class="app">
        <aside class="side" id="side">
            <div class="brand">SolRush <span>· admin</span></div>
            <nav id="nav"></nav>
            <div class="side-foot">
                <a class="quiet" href="/">← retour au jeu</a>
            </div>
        </aside>
        <div class="scrim" id="scrim"></div>

        <main class="main">
            <header class="top">
                <button class="burger" id="burger" aria-label="Menu"><svg class="i">
                        <use href="#ic-menu" /></svg></button>
                <h1 id="title">Vue d’ensemble</h1>
                <span class="when" id="when"></span>
                <div class="tools" id="tools"></div>
            </header>
            <div class="view" id="view" aria-busy="false"></div>
        </main>
    </div>

    <script type="module">
        /* Reads the session the game already stored. Same origin, so the token
           is right there — no second login to build, no second password to
           leak. The server checks the ACCOUNT behind that token against
           ADMIN_EMAILS on every request; nothing here is trusted. */
        const session = (() => {
            try { return JSON.parse(localStorage.getItem('wr_session') || 'null'); }
            catch { return null; }
        })();

        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const icon = (n) => `<svg class="i"><use href="#ic-${n}"/></svg>`;

        async function api(path, body) {
            const r = await fetch(path, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: 'Bearer ' + (session?.access_token || ''),
                },
                body: JSON.stringify(body || {}),
            });
            if (r.status === 403) throw new HttpError(403);
            if (r.status === 401) throw new HttpError(401);
            if (!r.ok) throw new HttpError(r.status);
            return r.json();
        }
        class HttpError extends Error {
            constructor(status) { super('http ' + status); this.status = status; }
        }

        /* ================= formatting ================= */
        const n0 = (n) => Number(n || 0).toLocaleString('fr-FR');
        // FCFA has no subunit and the amounts are small; a grouped number with
        // the currency after it reads faster than any currency formatter.
        const money = (n) => n0(Math.round(n || 0)) + ' F';

        /* Durations in the units a person would say them in. "247 s" is a
           measurement; "4 min 07" is an answer to how long a game takes. */
        function dur(secs) {
            const s = Math.max(0, Math.round(secs || 0));
            if (!s) return '—';
            if (s < 60) return s + ' s';
            const m = Math.floor(s / 60);
            if (m < 60) return m + ' min ' + String(s % 60).padStart(2, '0');
            const h = Math.floor(m / 60);
            if (h < 48) return h + ' h ' + String(m % 60).padStart(2, '0');
            return Math.round(h / 24) + ' j';
        }

        const when = (iso) => iso
            ? new Date(iso).toLocaleString('fr', {
                day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
            })
            : '—';
        const dayLabel = (iso, opts) =>
            new Date(iso).toLocaleDateString('fr', opts || { day: 'numeric', month: 'short' });
        const pct = (a, b) => b > 0 ? (100 * a / b).toFixed(a / b < .1 ? 1 : 0) + ' %' : '—';

        /* Change against the same length of time immediately before.

           From nothing to something is not "+∞ %", and printing that is how a
           dashboard starts lying: it says "nouveau" instead. */
        function chip(now, was) {
            const a = Number(now) || 0, b = Number(was) || 0;
            if (!b) return a ? '<span class="chip up">nouveau</span>' : '';
            const p = Math.round(100 * (a - b) / b);
            if (p === 0) return '<span class="chip flat">stable</span>';
            return `<span class="chip ${p > 0 ? 'up' : 'down'}">${p > 0 ? '+' : ''}${p} %</span>`;
        }

        /* ================= the range ================= */
        /* Boundaries are the VIEWER's local midnights, and they are computed
           here rather than on the server for exactly that reason: "7 days" has
           to mean seven of their days, not seven UTC days ending at one in the
           morning. The server buckets from whatever start it is given, so the
           chart's columns come out in the same days too. */
        const PRESETS = [
            ['7', '7 derniers jours'],
            ['30', '30 derniers jours'],
            ['90', '90 derniers jours'],
            ['365', '12 derniers mois'],
            ['all', 'Depuis le début'],
        ];

        const state = {
            view: 'overview',
            preset: localStorage.getItem('adm_preset') || '30',
            from: localStorage.getItem('adm_from') || '',
            to: localStorage.getItem('adm_to') || '',
        };

        const isoDay = (d) => {
            const c = new Date(d);
            return `${c.getFullYear()}-${String(c.getMonth() + 1).padStart(2, '0')}-${String(c.getDate()).padStart(2, '0')}`;
        };

        function bounds() {
            // Exclusive end: tomorrow's local midnight, so today counts in full.
            const end = new Date(); end.setHours(0, 0, 0, 0); end.setDate(end.getDate() + 1);
            if (state.preset === 'custom' && state.from && state.to) {
                const f = new Date(state.from + 'T00:00:00');
                const t = new Date(state.to + 'T00:00:00'); t.setDate(t.getDate() + 1);
                return { from: f.toISOString(), to: t.toISOString() };
            }
            const days = state.preset === 'all' ? 1095 : Number(state.preset) || 30;
            const start = new Date(end); start.setDate(start.getDate() - days);
            return { from: start.toISOString(), to: end.toISOString() };
        }

        function rangeLabel() {
            const b = bounds();
            const last = new Date(Date.parse(b.to) - 1);
            if (state.preset === 'all') return 'depuis le début';
            /* The year is shown as soon as the range crosses one. Without it,
               "12 mois" read "22 août → 21 août" — which is not a range, it is
               a puzzle, and it looks exactly like a bug in the date maths. */
            const opts = new Date(b.from).getFullYear() === last.getFullYear()
                ? { day: 'numeric', month: 'short' }
                : { day: 'numeric', month: 'short', year: 'numeric' };
            return dayLabel(b.from, opts) + ' → ' + dayLabel(last, opts);
        }

        // The dates a preset would resolve to, so the panel can show them
        // beside each choice instead of making them a surprise.
        function presetDates(key) {
            const end = new Date(); end.setHours(0, 0, 0, 0); end.setDate(end.getDate() + 1);
            if (key === 'all') return '';
            const start = new Date(end);
            start.setDate(start.getDate() - Number(key));
            const last = new Date(end.getTime() - 1);
            /* Across a year boundary this goes numeric rather than showing
               "22 août 25", which reads as a day-and-month before it reads as
               a year and made "12 derniers mois" look like a mistake. */
            if (start.getFullYear() !== last.getFullYear()) {
                const short = (d) => d.toLocaleDateString('fr', {
                    day: '2-digit', month: '2-digit', year: '2-digit',
                });
                return short(start) + ' – ' + short(last);
            }
            const opts = { day: 'numeric', month: 'short' };
            return dayLabel(start, opts) + ' – ' + dayLabel(last, opts);
        }

        const presetName = () => state.preset === 'custom'
            ? 'Période choisie'
            : (PRESETS.find(([k]) => k === state.preset) || PRESETS[1])[1];

        function rangeControl() {
            const custom = state.preset === 'custom';
            const b = bounds();
            const today = isoDay(new Date());
            const start = custom && state.from ? state.from : isoDay(b.from);
            const stop = custom && state.to ? state.to : isoDay(new Date(Date.parse(b.to) - 1));
            return `
              <div class="picker">
                <button class="range-btn" id="range-btn" aria-expanded="false" aria-haspopup="dialog">
                  ${icon('cal')}
                  <span class="range-name">${esc(presetName())}</span>
                  <span class="range-dates">${esc(rangeLabel())}</span>
                  ${icon('chev').replace('class="i"', 'class="i chev"')}
                </button>
                <div class="pop" id="range-pop" role="dialog" aria-label="Période" hidden>
                  <div class="pop-head">Période</div>
                  ${PRESETS.map(([k, l]) => `
                    <button class="opt" data-preset="${k}" aria-pressed="${state.preset === k}">
                      ${icon('check')}<span>${l}</span><small>${esc(presetDates(k))}</small>
                    </button>`).join('')}
                  <div class="pop-sep"></div>
                  <button class="opt" data-preset="custom" aria-pressed="${custom}">
                    ${icon('check')}<span>Période personnalisée</span>
                  </button>
                  <div class="pop-custom">
                    <label>Du <input type="date" id="d-from"
                        value="${esc(start)}" max="${esc(today)}"></label>
                    <label>Au <input type="date" id="d-to"
                        value="${esc(stop)}" max="${esc(today)}"></label>
                    <button class="solid" id="d-go">Appliquer cette période</button>
                  </div>
                </div>
              </div>`;
        }

        /* Open and shut.

           The scrim is a real element rather than a document-level click
           handler: a handler on document fires for the very click that opened
           the panel unless it is deferred, and that kind of ordering bug shows
           up as "the menu will not open" on exactly one browser. */
        const onPhone = () => window.matchMedia('(max-width: 700px)').matches;

        function closeRange() {
            const pop = $('range-pop'), btn = $('range-btn');
            if (pop) {
                pop.hidden = true;
                pop.style.cssText = '';
                // Put it back where paintTools() expects to find it, so the
                // next repaint of the toolbar does not leave an orphan on
                // <body> and build a second one beside it.
                document.querySelector('.picker')?.appendChild(pop);
            }
            if (btn) btn.setAttribute('aria-expanded', 'false');
            document.getElementById('pop-scrim')?.remove();
        }

        function openRange() {
            const pop = $('range-pop'), btn = $('range-btn');
            if (!pop) return;

            const scrim = document.createElement('div');
            scrim.className = 'pop-scrim';
            scrim.id = 'pop-scrim';
            scrim.onclick = closeRange;
            document.body.appendChild(scrim);

            // Out of the sticky bar and onto <body>, where its z-index means
            // what it says.
            document.body.appendChild(pop);
            pop.hidden = false;
            btn.setAttribute('aria-expanded', 'true');

            /* On a phone the stylesheet pins it to the bottom of the screen and
               no coordinates are wanted — inline ones would beat the media
               query and drag the sheet back up. On a wide screen it is anchored
               under the trigger by hand, which is what moving it out of the bar
               costs. */
            if (onPhone()) return;
            const r = btn.getBoundingClientRect();
            pop.style.top = Math.round(r.bottom + 8) + 'px';
            pop.style.left = Math.round(Math.max(8, r.right - pop.offsetWidth)) + 'px';
        }

        /* ================= chart ================= */
        let metric = 'games';
        const METRICS = {
            games: ['Parties', (v) => n0(v)],
            revenue: ['Revenus', (v) => money(v)],
            signups: ['Inscriptions', (v) => n0(v)],
        };

        function chart(series, step, only, range) {
            const keys = only ? [only] : Object.keys(METRICS);
            const key = only || metric;
            const [label, fmt] = METRICS[key];
            const vals = series.map((r) => Number(r[key]) || 0);
            // Scaled to the tallest bar rather than to a round number: with one
            // or two games a day, a fixed scale is a row of invisible bars.
            const top = Math.max(...vals, 1);
            const total = vals.reduce((a, b) => a + b, 0);
            const last = series.length - 1;
            const weekly = step > 1;

            const bars = series.map((r, i) => {
                const v = Number(r[key]) || 0;
                const d = new Date(r.day + 'T12:00:00');
                const title = (weekly ? 'semaine du ' : '')
                    + d.toLocaleDateString('fr', { weekday: weekly ? undefined : 'long', day: 'numeric', month: 'long' })
                    + ' — ' + fmt(v);
                return `<div class="col ${v ? '' : 'zero'} ${i === last ? 'last' : ''}" title="${esc(title)}">
                          <i style="height:${v ? Math.max(3, Math.round(100 * v / top)) : 2}%"></i>
                        </div>`;
            }).join('');

            // A label under every column is unreadable; roughly six across the
            // width gives the eye an anchor without crowding.
            const every = Math.max(1, Math.round(series.length / 6));
            const axis = series.map((r, i) => {
                const show = i === last || (last - i) % every === 0;
                return `<span>${show ? esc(dayLabel(r.day + 'T12:00:00')) : ''}</span>`;
            }).join('');

            return `
              <div class="sec-head">
                <h2>${weekly ? 'par semaine' : 'par jour'}</h2>
                ${only ? '' : `<div class="seg" id="seg">
                  ${keys.map((k) => `<button data-metric="${k}"
                      aria-pressed="${k === key}">${METRICS[k][0]}</button>`).join('')}
                </div>`}
                <span class="note">${esc(label.toLowerCase())} · ${esc(fmt(total))} sur la période</span>
              </div>
              <div class="card" id="chart-card"
                   data-from="${esc(range?.from || '')}" data-to="${esc(range?.to || '')}"
                   data-step="${esc(String(step))}">
                <div class="y-top">max ${esc(fmt(top))}</div>
                <div class="chart">${bars}</div>
                <div class="x-axis">${axis}</div>
              </div>`;
        }

        /* ================= skeletons =================

           One per view, shaped like what is coming. The point is not decoration
           — it is that nothing MOVES when the data arrives: the tiles are
           already there, in the right grid, at the right height, and the grey
           blocks inside them turn into numbers. A spinner, or the single "…"
           this used to show, throws the layout away and rebuilds it, which
           reads as the page breaking and repairing itself on every click. */
        const sk = (w, h) => `<div class="sk" style="width:${w};height:${h}"></div>`;
        const skLines = (...ws) => ws.map((w) => `<div class="sk sk-line" style="width:${w};height:9px"></div>`).join('');

        /* Three bands, because a real tile is three: a figure, its label, and
           either a chip or a second line under it. Two bands left the
           placeholder a hundred pixels short over four rows, which is a jump
           on landing however right the rest of it looked. */
        const skTiles = (n, cls = 'by4') => `<div class="tiles ${cls}">${
            Array.from({ length: n }, () => `<div class="tile">
                ${sk('52%', '26px')}<div style="height:10px"></div>
                ${skLines('78%', '46%')}
            </div>`).join('')}</div>`;

        const skHead = () => `<div class="sec-head">${sk('120px', '10px')}</div>`;

        const skHero = () => `<div class="card hero">
            <div class="hero-main">
              ${sk('44%', '10px')}<div style="height:12px"></div>
              ${sk('62%', '38px')}<div style="height:12px"></div>
              ${skLines('94%', '88%', '52%')}
            </div>
            <div class="hero-side">
              <div style="display:block">${sk('64%', '17px')}<div style="height:6px"></div>${sk('80%', '10px')}</div>
              <div style="display:block">${sk('34%', '17px')}<div style="height:6px"></div>${sk('72%', '10px')}</div>
            </div>
          </div>`;

        /* Bar heights are fixed, not random: a skeleton that reshuffles itself
           on every paint draws the eye to the placeholder instead of past it. */
        const SK_BARS = [38, 62, 28, 74, 45, 88, 34, 56, 70, 41, 60, 30, 80, 50];
        const skChart = () => `${skHead()}<div class="card">
            ${sk('70px', '9px')}<div style="height:10px"></div>
            <div class="sk-bars">${SK_BARS.map((h) => `<div class="sk" style="height:${h}%"></div>`).join('')}</div>
            <div style="height:8px"></div>${sk('100%', '9px')}
          </div>`;

        /* Rows on their own, because a table that reloads inside a card it
           already has must not grow a second card around itself — which is
           exactly what replacing the whole block with skTable() did. */
        const skRows = (rows = 6) => `<div class="skel">${
            Array.from({ length: rows }, () => `<div class="sk-row">
                <div class="grow">${skLines('42%', '28%')}</div>
                ${sk('52px', '11px')}${sk('74px', '11px')}
            </div>`).join('')}</div>`;

        const skTable = (rows = 6) => `<div class="card">${skRows(rows)}</div>`;

        /* Wrapped in the same <section> elements the real views use, and that is
           not tidiness — section carries the 22px that separates one group from
           the next. Without it the placeholder was correct block by block and
           still a centimetre shorter overall, so the page shuffled upwards when
           the data landed. A skeleton that gets the spacing wrong is a jump
           with extra steps. */
        const sec = (...parts) => parts.map((p) => `<section>${p}</section>`).join('');

        const SKELETON = {
            overview: () => sec(skHero(), skHead() + skTiles(8), skChart(), skHead() + skTiles(3, 'by3')),
            revenue: () => sec(skHero(), skHead() + skTiles(4), skChart(), skHead() + skTable(6)),
            players: () => sec(
                `<div class="card">${sk('100%', '38px')}<div style="height:10px"></div>${sk('58%', '30px')}</div>`,
                skHead() + skTable(8)),
            matches: () => sec(skHead() + skTable(9)),
            time: () => sec(skHead() + skTiles(3, 'by3'), skHead() + skTiles(3, 'by3'),
                skHead() + skTiles(3, 'by3')),
            live: () => sec(skTiles(3, 'by3'), skHead() + skTable(5)),
        };

        /* ================= views ================= */
        const VIEWS = {
            overview: { title: 'Vue d’ensemble', icon: 'overview', ranged: true },
            revenue: { title: 'Revenus', icon: 'revenue', ranged: true },
            players: { title: 'Joueurs', icon: 'players', ranged: false },
            matches: { title: 'Parties', icon: 'matches', ranged: true },
            time: { title: 'Temps passé', icon: 'time', ranged: true },
            live: { title: 'En direct', icon: 'live', ranged: false },
        };

        const CART = {
            completed: ['ok', 'payé'],
            waiting_payment: ['wait', 'en attente'],
            payment_failed: ['no', 'échoué'],
            abandoned: ['no', 'abandonné'],
        };

        // One overview answer serves three views; refetching it for each tab
        // would be three identical round trips to Neon per click.
        let cache = { key: '', data: null };
        async function overview(fresh) {
            const b = bounds();
            const key = b.from + b.to;
            if (!fresh && cache.key === key && cache.data) return cache.data;
            const data = await api('/api/admin/overview', b);
            cache = { key, data };
            return data;
        }

        function heroCard(d) {
            const m = d.money, w = d.was.money;
            /* Part of this total is a guess — sales made before amounts were
               recorded are valued at the catalogue price — and the page says so
               rather than presenting an estimate as a figure. */
            const note = m.unpriced
                ? ` · dont ${m.unpriced} vente${m.unpriced > 1 ? 's' : ''} estimée${m.unpriced > 1 ? 's' : ''}
                    au prix catalogue (${money(d.price)})`
                : '';
            return `<div class="card hero">
                <div class="hero-main">
                  <div class="cap">Revenus · ${esc(rangeLabel())}</div>
                  <div class="big">${m.unpriced ? '≈ ' : ''}${money(m.revenue)}
                      ${chip(m.revenue, w.revenue)}</div>
                  <p class="sub" style="margin:9px 0 0">
                    ${m.paid} vente${m.paid > 1 ? 's' : ''} sur ${m.attempts} tentative${m.attempts > 1 ? 's' : ''}
                    (${pct(m.paid, m.attempts)})${note}
                    ${d.payments ? '' : ' · paiements non configurés sur ce serveur'}
                  </p>
                </div>
                <div class="hero-side">
                  <div><b>${money(m.revenue_all)}</b><small>depuis le début</small></div>
                  <div><b>${n0(m.paid_all)}</b><small>vente${m.paid_all > 1 ? 's' : ''} au total</small></div>
                </div>
              </div>`;
        }

        const RENDER = {
            async overview(fresh) {
                const d = await overview(fresh);
                const a = d.activity, w = d.was.activity, t = d.time, s = d.session;
                return `
                  <section>${heroCard(d)}</section>
                  <section>
                    <div class="sec-head"><h2>Sur la période</h2>
                      <span class="note">${esc(rangeLabel())}</span></div>
                    <div class="tiles by4">
                      <div class="tile"><b>${n0(a.games)}</b><span class="lab">parties jouées</span>
                          ${chip(a.games, w.games)}</div>
                      <div class="tile"><b>${n0(a.players)}</b><span class="lab">joueurs actifs</span>
                          ${chip(a.players, w.players)}</div>
                      <div class="tile"><b>${n0(a.new_users)}</b><span class="lab">nouveaux comptes</span>
                          ${chip(a.new_users, w.new_users)}</div>
                      <div class="tile"><b>${dur(t.med_game)}</b><span class="lab">durée d’une partie</span>
                          <em>médiane</em></div>
                      <div class="tile"><b>${n0(a.accounts)}</b><span class="lab">comptes au total</span></div>
                      <div class="tile"><b>${n0(a.plus)}</b><span class="lab">comptes Plus</span>
                          <em>${pct(a.plus, a.accounts)} des comptes</em></div>
                      <div class="tile"><b>${n0(a.games_all)}</b><span class="lab">parties au total</span></div>
                      <div class="tile ${d.money.pending ? 'alert' : ''}"><b>${n0(d.money.pending)}</b>
                          <span class="lab">paiements en attente</span>
                          ${d.money.pending ? '<em>à vérifier dans Revenus</em>' : ''}</div>
                    </div>
                  </section>
                  <section id="chart-sec">${chart(d.series, d.range.step, null, d.range)}</section>
                  <section>
                    <div class="sec-head"><h2>Temps</h2>
                      <span class="note">détail dans « Temps passé »</span></div>
                    <div class="tiles by3">
                      <div class="tile"><b>${dur(t.avg_game)}</b><span class="lab">durée moyenne</span></div>
                      <div class="tile"><b>${dur(s.avg_day)}</b><span class="lab">temps par joueur</span>
                          <em>et par jour</em></div>
                      <div class="tile"><b>${dur(t.played)}</b><span class="lab">temps joué</span>
                          <em>sur la période</em></div>
                    </div>
                  </section>`;
            },

            async revenue(fresh) {
                const d = await overview(fresh);
                const m = d.money;
                payState.status = payState.status || '';
                const pay = await api('/api/admin/payments',
                    { ...bounds(), status: payState.status || undefined, limit: payState.limit, offset: 0 });
                payState.rows = pay.rows;
                payState.total = pay.total;
                return `
                  <section>${heroCard(d)}</section>
                  <section>
                    <div class="sec-head"><h2>Entonnoir</h2></div>
                    <div class="tiles by4">
                      <div class="tile"><b>${n0(m.attempts)}</b><span class="lab">tentatives d’achat</span>
                          ${chip(m.attempts, d.was.money.attempts)}</div>
                      <div class="tile"><b>${n0(m.paid)}</b><span class="lab">ventes abouties</span>
                          <em>${pct(m.paid, m.attempts)} des tentatives</em></div>
                      <div class="tile ${m.pending ? 'alert' : ''}"><b>${n0(m.pending)}</b>
                          <span class="lab">en attente</span><em>tous temps confondus</em></div>
                      <div class="tile"><b>${m.paid ? money(Math.round(m.revenue / m.paid)) : '—'}</b>
                          <span class="lab">panier moyen</span></div>
                    </div>
                  </section>
                  <section id="chart-sec">${chart(d.series, d.range.step, 'revenue', d.range)}</section>
                  <section>
                    <div class="sec-head"><h2>Paiements</h2>
                      <div class="seg" id="pay-filter">
                        ${[['', 'Tous'], ['completed', 'Payés'], ['waiting_payment', 'En attente'],
                        ['payment_failed', 'Échoués'], ['abandoned', 'Abandonnés']]
                        .map(([k, l]) => `<button data-status="${k}"
                            aria-pressed="${payState.status === k}">${l}</button>`).join('')}
                      </div>
                      <span class="note">${n0(pay.total)} sur la période</span></div>
                    <div class="card" id="pay-box">${paymentsTable()}</div>
                  </section>`;
            },

            async players() {
                const out = await api('/api/admin/players',
                    { q: playerState.q, sort: playerState.sort, limit: 50 });
                playerState.rows = out.rows;
                return `
                  <section>
                    <div class="sec-head"><h2>Chercher</h2></div>
                    <div class="card">
                      <div class="row">
                        <input class="grow" id="q" placeholder="email ou pseudo"
                               autocomplete="off" value="${esc(playerState.q)}">
                        <button class="solid" id="go">Chercher</button>
                      </div>
                      <div class="row" style="margin-top:10px">
                        <div class="seg" id="sortby">
                          ${[['recent', 'Vus récemment'], ['points', 'Meilleurs'],
                        ['new', 'Nouveaux'], ['plus', 'Plus d’abord']]
                        .map(([k, l]) => `<button data-sort="${k}"
                              aria-pressed="${playerState.sort === k}">${l}</button>`).join('')}
                        </div>
                      </div>
                    </div>
                  </section>
                  <section>
                    <div class="sec-head"><h2>${out.searched ? 'Résultats' : 'Comptes'}</h2>
                      <span class="note">${n0(out.rows.length)} affiché${out.rows.length > 1 ? 's' : ''}</span></div>
                    <div class="card" id="players-box">${playersTable()}</div>
                  </section>`;
            },

            async matches() {
                const out = await api('/api/admin/matches', { ...bounds(), limit: matchState.limit, offset: 0 });
                matchState.rows = out.rows;
                matchState.total = out.total;
                return `
                  <section>
                    <div class="sec-head"><h2>Parties terminées</h2>
                      <span class="note">${n0(out.total)} sur la période</span></div>
                    <div class="card" id="match-box">${matchesTable()}</div>
                  </section>`;
            },

            async time(fresh) {
                const d = await overview(fresh);
                const t = d.time, s = d.session, a = d.activity;
                return `
                  <section>
                    <div class="sec-head"><h2>Une partie</h2>
                      <span class="note">${n0(t.counted)} partie${t.counted > 1 ? 's' : ''} mesurée${t.counted > 1 ? 's' : ''}</span></div>
                    <div class="tiles by3">
                      <div class="tile"><b>${dur(t.med_game)}</b><span class="lab">durée médiane</span></div>
                      <div class="tile"><b>${dur(t.avg_game)}</b><span class="lab">durée moyenne</span></div>
                      <div class="tile"><b>${a.players ? (a.games / a.players).toFixed(1) : '—'}</b>
                          <span class="lab">parties par joueur</span></div>
                    </div>
                    <p class="sub" style="margin:10px 2px 0">
                      La médiane est là à côté de la moyenne parce qu’un seul onglet oublié
                      déplace une moyenne où il veut. Au-delà de deux heures, la partie est
                      écartée du calcul : c’est un onglet, pas une partie.
                    </p>
                  </section>
                  <section>
                    <div class="sec-head"><h2>Un joueur</h2></div>
                    <div class="tiles by3">
                      <div class="tile"><b>${dur(s.avg_day)}</b><span class="lab">temps sur le jeu</span>
                          <em>par joueur et par jour</em></div>
                      <div class="tile"><b>${dur(s.total)}</b><span class="lab">temps cumulé</span>
                          <em>sur la période</em></div>
                      <div class="tile"><b>${n0(s.devices)}</b><span class="lab">appareils mesurés</span>
                          <em>${n0(s.device_days)} journée${s.device_days > 1 ? 's' : ''}-joueur</em></div>
                    </div>
                    <p class="sub" style="margin:10px 2px 0">
                      ${s.device_days
                        ? `Le navigateur ne compte que les secondes où la page est réellement à
                           l’écran : un onglet ouvert tout l’après-midi en arrière-plan ne compte pas
                           comme un après-midi de jeu.`
                        : `Aucune mesure sur cette période. La mesure ne démarre qu’à partir du
                           déploiement qui l’a introduite — une période antérieure sera toujours vide.`}
                    </p>
                  </section>
                  <section>
                    <div class="sec-head"><h2>Temps joué</h2></div>
                    <div class="tiles by3">
                      <div class="tile"><b>${dur(t.played)}</b><span class="lab">sur la période</span></div>
                      <div class="tile"><b>${n0(a.games)}</b><span class="lab">parties</span></div>
                      <div class="tile"><b>${n0(a.players)}</b><span class="lab">joueurs actifs</span></div>
                    </div>
                  </section>`;
            },

            async live() {
                const d = await api('/api/admin/live');
                return `
                  <section><div id="live-tiles">${liveTiles(d)}</div></section>
                  <section>
                    <div class="sec-head"><h2>Connectés maintenant</h2>
                      <span class="note">rafraîchi toutes les 10 s</span></div>
                    <div class="card" id="live-rows">${liveRows(d)}</div>
                  </section>`;
            },
        };

        /* ================= tables that reload in place ================= */

        /* The live view is the one thing on a timer, so it is the one view that
           must NOT be redrawn wholesale: replacing the page every ten seconds
           throws away the scroll position and blinks the whole list at somebody
           who is reading it. Only these two blocks are rewritten. */
        const liveTiles = (d) => `<div class="tiles by3">
            <div class="tile"><b>${n0(d.live)}</b><span class="lab">joueurs actifs</span></div>
            <div class="tile"><b>${n0(d.online.length - d.live)}</b>
                <span class="lab">en reconnexion</span></div>
            <div class="tile"><b>${n0(d.rooms)}</b><span class="lab">salons ouverts</span></div>
          </div>`;

        function liveRows(d) {
            if (!d.online.length) return '<p class="empty">Personne de connecté.</p>';
            const rows = d.online.map((p) => `
              <tr>
                <td data-label="Joueur"><span class="dot ${p.away ? 'away' : 'beat'}"></span>
                    <span class="who">${esc(p.nick)}</span>
                    ${p.plus ? ' <span class="pill plus">Plus</span>' : ''}</td>
                <td data-label="Compte">${p.account ? 'inscrit' : '<span class="sub">invité</span>'}</td>
                <td data-label="Points">${n0(p.points)}</td>
                <td data-label="État">${p.away ? '<span class="sub">déconnecté</span>'
                    : p.playing ? `en partie <span class="sub">${esc(p.room || '')}</span>`
                        : p.room ? `salon <span class="sub">${esc(p.room)}</span>` : 'dans les menus'}</td>
              </tr>`).join('');
            return `<table><thead><tr><th>Joueur</th><th>Compte</th><th>Points</th><th>État</th></tr></thead>
                <tbody>${rows}</tbody></table>`;
        }
        const payState = { status: '', limit: 50, rows: [], total: 0 };
        const matchState = { limit: 50, rows: [], total: 0 };
        const playerState = { q: '', sort: 'recent', rows: [] };

        function paymentsTable() {
            if (!payState.rows.length) return '<p class="empty">Aucune tentative d’achat sur cette période.</p>';
            const rows = payState.rows.map((c) => {
                const [cls, label] = CART[c.status] || ['wait', c.status];
                return `<tr>
                  <td data-label="Joueur"><span class="who">${esc(c.nick)}</span>
                      <div class="sub">${esc(c.email)}</div></td>
                  <td data-label="Montant">${c.amount ? money(c.amount) : '<span class="sub">—</span>'}</td>
                  <td data-label="État"><span class="pill ${cls}">${label}</span>
                      ${c.plus ? ' <span class="pill plus">Plus</span>' : ''}</td>
                  <td data-label="Créé">${when(c.created_at)}</td>
                  <td>${c.status === 'waiting_payment'
                        ? `<button data-cart="${esc(c.cart_id)}">Vérifier</button>` : ''}</td>
                </tr>`;
            }).join('');
            return `<table><thead><tr><th>Joueur</th><th>Montant</th><th>État</th><th>Créé</th><th></th></tr></thead>
                <tbody>${rows}</tbody></table>
                ${payState.rows.length < payState.total
                    ? `<div class="more"><button id="pay-more">Voir ${
                        Math.min(50, payState.total - payState.rows.length)} de plus</button></div>` : ''}`;
        }

        function matchesTable() {
            if (!matchState.rows.length) return '<p class="empty">Aucune partie terminée sur cette période.</p>';
            const rows = matchState.rows.map((m) => {
                const secs = m.started_at && m.ended_at
                    ? (new Date(m.ended_at) - new Date(m.started_at)) / 1000 : 0;
                return `<tr>
                  <td data-label="Partie"><span class="who">${esc(m.p0_nick)}</span>
                      <span class="sub">contre</span> ${esc(m.p1_nick)}
                      <div class="sub">${esc(m.mode)} · ${m.moves} coups · ${esc(m.reason || '')}</div></td>
                  <td data-label="Durée">${secs > 0 && secs < 7200 ? dur(secs) : '—'}</td>
                  <td data-label="Fin">${when(m.ended_at)}</td>
                  <td>${m.token ? `<a href="/r/${esc(m.token)}">revoir ↗</a>` : ''}</td>
                </tr>`;
            }).join('');
            return `<table><thead><tr><th>Partie</th><th>Durée</th><th>Fin</th><th></th></tr></thead>
                <tbody>${rows}</tbody></table>
                ${matchState.rows.length < matchState.total
                    ? `<div class="more"><button id="match-more">Voir ${
                        Math.min(50, matchState.total - matchState.rows.length)} de plus</button></div>` : ''}`;
        }

        function playersTable() {
            if (!playerState.rows.length) return '<p class="empty">Personne trouvé.</p>';
            const rows = playerState.rows.map((u) => `
              <tr>
                <td data-label="Joueur"><span class="who">${esc(u.nick)}</span>
                    ${u.plus ? ' <span class="pill plus">Plus</span>' : ''}
                    <div class="sub">${esc(u.email)}</div></td>
                <td data-label="Points">${n0(u.points)}<div class="sub">${u.wins} V / ${u.losses} D</div></td>
                <td data-label="Inscrit">${when(u.created_at)}</td>
                <td data-label="Vu">${when(u.last_seen)}</td>
                <td><button data-user="${esc(u.id)}" data-on="${u.plus ? '0' : '1'}">
                    ${u.plus ? 'Retirer Plus' : 'Donner Plus'}</button></td>
              </tr>`).join('');
            return `<table><thead><tr><th>Joueur</th><th>Points</th><th>Inscrit</th><th>Vu</th><th></th></tr></thead>
                <tbody>${rows}</tbody></table>`;
        }

        /* ================= wiring ================= */
        function gate(msg) {
            $('view').innerHTML = `<div class="gate card"><p>${esc(msg)}</p>
                <p><a href="/">Ouvrir SolRush et se connecter</a></p></div>`;
            $('tools').innerHTML = '';
            $('when').textContent = '';
        }

        // Last known count of connected players. Held here so that navigating
        // does not blank the sidebar badge until the next ten-second poll — it
        // used to vanish on every click and come back a moment later, which
        // reads as a number that cannot be trusted.
        let liveCount = null;

        function paintNav() {
            $('nav').innerHTML = Object.entries(VIEWS).map(([k, v]) => `
              <button data-view="${k}" ${state.view === k ? 'aria-current="page"' : ''}>
                ${icon(v.icon)}<span>${v.title}</span>
                ${k === 'live' ? `<span class="tag" id="live-tag"
                    ${liveCount === null ? 'hidden' : ''}>${liveCount ?? 0}</span>` : ''}
              </button>`).join('');
            for (const b of $('nav').querySelectorAll('[data-view]')) {
                b.onclick = () => { document.body.classList.remove('open'); go(b.dataset.view); };
            }
        }

        function paintTools() {
            const v = VIEWS[state.view];
            $('tools').innerHTML = (v.ranged ? rangeControl() : '')
                + `<button id="refresh" aria-label="Actualiser">${icon('refresh')}</button>`;
            $('refresh').onclick = () => draw(true);

            const btn = $('range-btn');
            if (btn) {
                btn.onclick = () => {
                    if ($('range-pop').hidden) openRange(); else closeRange();
                };
                for (const b of $('range-pop').querySelectorAll('[data-preset]')) {
                    b.onclick = () => {
                        state.preset = b.dataset.preset;
                        localStorage.setItem('adm_preset', state.preset);
                        /* "Période personnalisée" only marks itself chosen — the
                           panel stays open so the two dates can be filled in.
                           Every other choice is complete on its own and closes. */
                        if (state.preset === 'custom') {
                            for (const x of $('range-pop').querySelectorAll('[data-preset]')) {
                                x.setAttribute('aria-pressed', String(x.dataset.preset === 'custom'));
                            }
                            $('d-from').focus();
                            return;
                        }
                        closeRange();
                        draw();
                    };
                }
                $('d-go').onclick = () => {
                    const f = $('d-from').value, t = $('d-to').value;
                    if (!f || !t) return;
                    // Swapped dates are a slip, not an error worth refusing.
                    state.preset = 'custom';
                    state.from = f <= t ? f : t;
                    state.to = f <= t ? t : f;
                    localStorage.setItem('adm_preset', 'custom');
                    localStorage.setItem('adm_from', state.from);
                    localStorage.setItem('adm_to', state.to);
                    closeRange();
                    draw();
                };
            }
        }

        /* Renders are numbered so a slow one cannot land on top of a fast one.

           Without this, clicking "90 j" while "7 j" is still in flight is a
           coin toss: whichever request answers LAST writes the page, and the
           losing combination is the worst one to look at — the heading is drawn
           from the range now selected while the chart underneath is the data
           from the range before it. Both look plausible; only one is true. */
        let drawing = 0;

        async function draw(fresh) {
            const mine = ++drawing;
            $('title').textContent = VIEWS[state.view].title;
            $('view').setAttribute('aria-busy', 'true');
            $('view').innerHTML = `<div class="skel">${(SKELETON[state.view] || SKELETON.matches)()}</div>`;
            paintTools();
            try {
                const html = await RENDER[state.view](fresh);
                if (mine !== drawing) return;   // a newer draw has started; drop this one
                $('view').innerHTML = html;
                $('view').setAttribute('aria-busy', 'false');
                $('when').textContent = 'à ' + new Date().toLocaleTimeString('fr');
                wire();
            } catch (e) {
                if (mine !== drawing) return;
                $('view').setAttribute('aria-busy', 'false');
                if (e.status === 403) {
                    return gate('Ce compte n’a pas accès à l’administration. '
                        + 'Vérifie ADMIN_EMAILS sur le serveur.');
                }
                if (e.status === 401) return gate('Session expirée. Reconnecte-toi sur SolRush.');
                $('view').innerHTML = `<div class="card"><p class="empty">Le serveur n’a pas répondu (${esc(e.message)}).</p></div>`;
            }
        }

        /* Every handler is attached after each paint, because each view replaces
           its own markup. Written once here rather than inside six renderers,
           so a control that moves between views does not lose its behaviour. */
        function wire() {
            const seg = $('seg');
            if (seg) {
                for (const b of seg.querySelectorAll('[data-metric]')) {
                    b.onclick = async () => {
                        metric = b.dataset.metric;
                        const d = await overview();
                        // Only the chart is replaced. Redrawing the page would
                        // throw away whatever is half typed in a box.
                        $('chart-sec').innerHTML = chart(d.series, d.range.step, null, d.range);
                        wire();
                    };
                }
            }

            const filter = $('pay-filter');
            if (filter) {
                for (const b of filter.querySelectorAll('[data-status]')) {
                    b.onclick = async () => {
                        payState.status = b.dataset.status;
                        payState.limit = 50;
                        for (const x of filter.querySelectorAll('[data-status]')) {
                            x.setAttribute('aria-pressed', String(x.dataset.status === payState.status));
                        }
                        // Same skeleton the full page uses, so a filter change
                        // looks like the same operation it is.
                        $('pay-box').innerHTML = skRows(5);
                        const out = await api('/api/admin/payments', {
                            ...bounds(), status: payState.status || undefined, limit: 50, offset: 0,
                        });
                        payState.rows = out.rows; payState.total = out.total;
                        $('pay-box').innerHTML = paymentsTable();
                        wire();
                    };
                }
            }

            const payMore = $('pay-more');
            if (payMore) {
                payMore.onclick = async () => {
