<!DOCTYPE html>
<html lang="fr" translate="no" class="notranslate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7fb">
    <title>SolRush — Administration</title>

    <!-- Never indexed, never followed, never cached by a crawler. A panel that
         shows player emails and payment records has no business in a search
         result, and robots.txt alone is a request rather than an instruction. -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="google" content="notranslate">

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">

    <!-- Self-contained, like the rules pages: the app stylesheet is built
         around the game's own markup and carries the whole board with it.

         The palette here is deliberately NOT the game's. The game is a toy and
         is coloured like one; this is a page for reading numbers off, and the
         thing that makes numbers readable is that almost nothing else on the
         page is competing for attention. One accent, hairline borders, no
         gradients, no shadows beyond a single hairline lift. -->
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --line: #e7eaf3;
            --line-soft: #eef1f7;
            --text: #10131f;
            --muted: #6f7690;
            --faint: #9aa1b8;
            --accent: #2f6df6;
            --accent-soft: rgba(47, 109, 246, .1);
            --good: #12a06a;
            --warn: #b8791a;
            --bad: #d34550;
            --gold: #9a7715;
            --gold-soft: rgba(224, 182, 74, .18);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d0f16;
                --card: #151824;
                --line: #242938;
                --line-soft: #1d2130;
                --text: #eef0f7;
                --muted: #8f97b0;
                --faint: #6b7391;
                --accent: #6f9bff;
                --accent-soft: rgba(111, 155, 255, .14);
                --good: #35c98d;
                --warn: #e0a13a;
                --bad: #f0737d;
                --gold: #e0b64a;
                --gold-soft: rgba(224, 182, 74, .16);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0d0f16;
            --card: #151824;
            --line: #242938;
            --line-soft: #1d2130;
            --text: #eef0f7;
            --muted: #8f97b0;
            --faint: #6b7391;
            --accent: #6f9bff;
            --accent-soft: rgba(111, 155, 255, .14);
            --good: #35c98d;
            --warn: #e0a13a;
            --bad: #f0737d;
            --gold: #e0b64a;
            --gold-soft: rgba(224, 182, 74, .16);
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Every figure on this page is read by comparing it with the one above
           it, and proportional digits make columns of numbers wobble. */
        b,
        .num,
        td,
        th {
            font-variant-numeric: tabular-nums;
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 16px calc(64px + env(safe-area-inset-bottom, 0px));
        }

        /* ---------- top bar ---------- */
        .bar {
            position: sticky;
            top: 0;
            z-index: 5;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(1.4) blur(10px);
            border-bottom: 1px solid var(--line);
        }

        .bar-in {
            max-width: 1080px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mark {
            font-weight: 700;
            letter-spacing: -.01em;
            font-size: .98rem;
            white-space: nowrap;
        }

        .mark span {
            color: var(--faint);
            font-weight: 500;
        }

        .bar-in .spacer {
            flex: 1;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .78rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .beat {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--good);
        }

        /* One slow pulse. Enough to say the page is refreshing itself, quiet
           enough to leave open on a desk. */
        @media (prefers-reduced-motion: no-preference) {
            .beat {
                animation: beat 2.4s ease-in-out infinite;
            }
        }

        @keyframes beat {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .25;
            }
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        a.quiet {
            color: var(--muted);
            font-weight: 500;
            font-size: .84rem;
        }

        a.quiet:hover {
            color: var(--text);
        }

        /* ---------- sections ---------- */
        section {
            margin: 30px 0 0;
        }

        .sec-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 0 0 12px;
            /* On a phone the chart's heading, its three-way switch and its
               total do not fit on one line, and without this they squeeze
               instead of wrapping: "14 derniers jours" came out stacked one
               word per line beside a crushed segmented control. */
            flex-wrap: wrap;
        }

        .sec-head h2 {
            font-size: .74rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--faint);
            font-weight: 700;
        }

        .sec-head .note {
            font-size: .78rem;
            color: var(--faint);
            margin-inline-start: auto;
            text-align: end;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px 18px;
        }

        /* ---------- the money headline ---------- */
        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
            gap: 0;
            overflow: hidden;
            padding: 0;
        }

        .hero-main {
            padding: 22px 20px;
        }

        .hero-main .amount {
            font-size: clamp(2rem, 7vw, 2.9rem);
            font-weight: 700;
            letter-spacing: -.03em;
            line-height: 1.05;
        }

        .hero-main .amount i {
            font-style: normal;
            font-size: .42em;
            font-weight: 600;
            color: var(--muted);
            margin-inline-start: .35em;
            letter-spacing: 0;
        }

        .hero-main .cap {
            font-size: .78rem;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .hero-side {
            border-inline-start: 1px solid var(--line-soft);
            display: grid;
            grid-template-rows: repeat(2, 1fr);
        }

        .hero-side div {
            padding: 14px 18px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .hero-side div+div {
            border-top: 1px solid var(--line-soft);
        }

        .hero-side b {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .hero-side small {
            color: var(--muted);
            font-size: .8rem;
        }

        @media (max-width: 620px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-side {
                border-inline-start: 0;
                border-top: 1px solid var(--line-soft);
                grid-template-columns: 1fr 1fr;
                grid-template-rows: none;
            }

            .hero-side div+div {
                border-top: 0;
                border-inline-start: 1px solid var(--line-soft);
            }

            /* Half a phone's width is not enough for "1 000 F" and "30
               derniers jours" side by side: the amount broke across two lines
               between the number and its currency. Stacked, both fit. */
            .hero-side div {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                padding: 12px 14px;
            }

            .hero-side b {
                white-space: nowrap;
            }
        }

        /* ---------- stat tiles ---------- */
        /* auto-fit alone fits as many as will go, which on a wide screen put
           seven of the eight activity tiles on one row and left the eighth
           sitting on its own underneath. Below the breakpoint the count is
           whatever fits; above it, the row length is chosen to divide the
           number of tiles in each section — eight in fours, six in threes. */
        .tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
            gap: 10px;
        }

        @media (min-width: 760px) {
            .tiles.by4 {
                grid-template-columns: repeat(4, 1fr);
            }

            .tiles.by3 {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .tile {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 13px 14px;
        }

        .tile b {
            display: block;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1.15;
        }

        .tile span {
            font-size: .77rem;
            color: var(--muted);
        }

        .tile em {
            font-style: normal;
            display: block;
            font-size: .72rem;
            color: var(--faint);
            margin-top: 3px;
        }

        .tile.alert {
            border-color: color-mix(in srgb, var(--warn) 45%, var(--line));
        }

        .tile.alert b {
            color: var(--warn);
        }

        /* ---------- chart ---------- */
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 132px;
            margin-top: 4px;
        }

        .col {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
            border-radius: 6px;
            padding: 0 1px;
        }

        .col i {
            display: block;
            background: var(--accent);
            border-radius: 5px 5px 3px 3px;
            min-height: 3px;
            opacity: .9;
        }

        /* Today is the column being watched; the rest are history. */
        .col.today i {
            outline: 2px solid var(--accent-soft);
        }

        .col.zero i {
            background: var(--line);
        }

        .x-axis {
            display: flex;
            gap: 3px;
            margin-top: 8px;
        }

        .x-axis span {
            flex: 1;
            min-width: 0;
            text-align: center;
            font-size: .66rem;
            color: var(--faint);
            white-space: nowrap;
            overflow: hidden;
        }

        .seg {
            display: inline-flex;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
        }

        .seg button {
            border: 0;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: .78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .seg button[aria-pressed="true"] {
            background: var(--card);
            color: var(--text);
            box-shadow: 0 1px 2px rgba(16, 19, 31, .07);
        }

        /* ---------- tables ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .89rem;
        }

        th {
            text-align: start;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--faint);
            padding: 0 10px 8px 0;
            font-weight: 700;
        }

        td {
            padding: 10px 10px 10px 0;
            border-top: 1px solid var(--line-soft);
            vertical-align: middle;
        }

        tr:first-child td {
            border-top: 0;
        }

        td:last-child,
        th:last-child {
            padding-inline-end: 0;
            text-align: end;
        }

        .who {
            font-weight: 650;
        }

        .sub {
            color: var(--muted);
            font-size: .8rem;
            word-break: break-word;
        }

        .pill {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .pill.ok {
            background: color-mix(in srgb, var(--good) 13%, transparent);
            color: var(--good);
        }

        .pill.wait {
            background: color-mix(in srgb, var(--warn) 15%, transparent);
            color: var(--warn);
        }

        .pill.no {
            background: color-mix(in srgb, var(--bad) 12%, transparent);
            color: var(--bad);
        }

        .pill.plus {
            background: var(--gold-soft);
            color: var(--gold);
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-inline-end: 7px;
            background: var(--good);
            vertical-align: middle;
        }

        .dot.away {
            background: var(--faint);
        }

        button {
            font: inherit;
            cursor: pointer;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            padding: 7px 13px;
            font-size: .82rem;
            font-weight: 600;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.solid {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        button.solid:hover:not(:disabled) {
            color: #fff;
            filter: brightness(1.06);
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        input {
            font: inherit;
            width: 100%;
            padding: 11px 13px;
            border-radius: 11px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text);
        }

        input:focus {
            outline: 2px solid var(--accent-soft);
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .empty {
            color: var(--faint);
            font-size: .87rem;
            padding: 4px 0;
            margin: 0;
        }

        .gate {
            max-width: 440px;
            margin: 15vh auto;
            text-align: center;
        }

        .gate p {
            margin: 0 0 12px;
        }

        @media (max-width: 620px) {

            /* One row becomes one block. The header cells are gone and each
               value carries its own label instead — a payment row read one
               thumb-width at a time is a payment row nobody reads. */
            table,
            tbody,
            tr,
            td {
                display: block;
                width: 100%;
            }

            thead {
                display: none;
            }

            tr {
                border-top: 1px solid var(--line-soft);
                padding: 12px 0 10px;
            }

            tr:first-child {
                border-top: 0;
                padding-top: 2px;
            }

            td {
                border: 0;
                padding: 2px 0;
            }

            td:last-child {
                text-align: start;
                padding-top: 9px;
            }

            td[data-label]::before {
                content: attr(data-label) " ";
                color: var(--faint);
                font-size: .7rem;
                text-transform: uppercase;
                letter-spacing: .06em;
                font-weight: 700;
            }
        }
    </style>
</head>

<body>
    <div class="bar">
        <div class="bar-in">
            <div class="mark">SolRush <span>· Administration</span></div>
            <div class="spacer"></div>
            <span class="live" id="live" hidden><i class="beat"></i><span id="refreshed"></span></span>
            <a class="quiet" href="/">le jeu ↗</a>
        </div>
    </div>

    <div class="wrap">
        <div id="gate" class="gate" hidden></div>
        <main id="panel" hidden></main>
    </div>

    <script type="module">
        /* Reads the session the game already stored. Same origin, so the token
           is right there — no second login to build, no second password to
           leak. The server checks the ACCOUNT behind that token against
           ADMIN_EMAILS on every request; nothing here is trusted. */
        const KEY = 'wr_session';
        const session = (() => {
            try { return JSON.parse(localStorage.getItem(KEY) || 'null'); }
            catch { return null; }
        })();

        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        const post = (path, body) => fetch(path, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + (session?.access_token || ''),
            },
            body: JSON.stringify(body || {}),
        });

        function gate(msg) {
            $('panel').hidden = true;
            $('live').hidden = true;
            $('gate').hidden = false;
            $('gate').innerHTML = `<div class="card"><p>${esc(msg)}</p>
                <p><a href="/">Ouvrir SolRush et se connecter</a></p></div>`;
        }

        /* ---------- formatting ---------- */
        const n0 = (n) => Number(n || 0).toLocaleString('fr-FR');

        // FCFA has no subunit and the amounts are small; a bare grouped number
        // with the currency after it reads faster than any currency formatter.
        const money = (n) => n0(Math.round(n || 0)) + ' F';

        /* Durations in the units a person would say them in. "247 s" is a
           measurement; "4 min 07" is an answer to how long a game takes. */
        function dur(secs) {
            const s = Math.max(0, Math.round(secs || 0));
            if (!s) return '—';
            if (s < 60) return s + ' s';
            const m = Math.floor(s / 60);
            if (m < 60) return m + ' min ' + String(s % 60).padStart(2, '0');
            const h = Math.floor(m / 60);
            if (h < 48) return h + ' h ' + String(m % 60).padStart(2, '0');
            return Math.round(h / 24) + ' j';
        }

        const when = (iso) => iso
            ? new Date(iso).toLocaleString('fr', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
            : '—';

        const pct = (a, b) => b > 0 ? (100 * a / b).toFixed(a / b < 0.1 ? 1 : 0) + ' %' : '—';

        const CART = {
            completed: ['ok', 'payé'],
            waiting_payment: ['wait', 'en attente'],
            payment_failed: ['no', 'échoué'],
            abandoned: ['no', 'abandonné'],
        };

        /* ---------- the fourteen-day chart ---------- */
        // Which series is on screen. Kept outside render() so a refresh does
        // not throw the choice away every fifteen seconds.
        let metric = 'games';
        const METRICS = {
            games: ['Parties', (v) => n0(v)],
            revenue: ['Revenus', (v) => money(v)],
            signups: ['Inscriptions', (v) => n0(v)],
        };

        function chart(series) {
            const label = METRICS[metric][0], fmt = METRICS[metric][1];
            const vals = series.map((r) => Number(r[metric]) || 0);
            // Scaled to the tallest bar rather than to a round number: with one
            // or two games a day, a fixed scale is fourteen invisible bars.
            const top = Math.max(...vals, 1);
            const total = vals.reduce((a, b) => a + b, 0);
            const last = series.length - 1;

            const bars = series.map((r, i) => {
                const v = Number(r[metric]) || 0;
                const d = new Date(r.day + 'T12:00:00');
                const title = d.toLocaleDateString('fr', { weekday: 'long', day: 'numeric', month: 'long' })
                    + ' — ' + fmt(v);
                return `<div class="col ${v ? '' : 'zero'} ${i === last ? 'today' : ''}" title="${esc(title)}">
                          <i style="height:${v ? Math.max(4, Math.round(100 * v / top)) : 3}%"></i>
                        </div>`;
            }).join('');

            // A label under every column is unreadable on a phone; every third
            // gives the eye something to anchor on without crowding.
            const axis = series.map((r, i) => {
                const d = new Date(r.day + 'T12:00:00');
                const show = i === last || (last - i) % 3 === 0;
                return `<span>${show ? esc(d.toLocaleDateString('fr', { day: 'numeric', month: 'short' })) : ''}</span>`;
            }).join('');

            return `
              <div class="sec-head">
                <h2>14 derniers jours</h2>
                <div class="seg" id="seg">
                  ${Object.keys(METRICS).map((k) => `<button data-metric="${k}"
                      aria-pressed="${k === metric}">${METRICS[k][0]}</button>`).join('')}
                </div>
                <span class="note">${esc(label.toLowerCase())} · ${esc(fmt(total))} au total</span>
              </div>
              <div class="card">
                <div class="chart">${bars}</div>
                <div class="x-axis">${axis}</div>
              </div>`;
        }

        /* ---------- the page ---------- */
        function render(d) {
            const s = d.stats, m = d.money, t = d.time, ses = d.session;
            /* Carried across the fifteen-second refresh. Without it, typing an
               email into the search box is a race against a timer: the redraw
               replaces the input mid-word and the letters go nowhere. */
            const typed = $('q')?.value || '';
            const wasFocused = document.activeElement?.id === 'q';
            const results = $('found')?.innerHTML || '';
            const live = d.online.filter((p) => !p.away).length;

            /* Part of this total is a guess — sales made before amounts were
               recorded are valued at the catalogue price — and the page says
               so rather than presenting an estimate as a figure. The "≈" in
               front of the headline is there for the same reason. */
            const guessed = m.unpriced;
            const missing = guessed
                ? ` · dont ${guessed} vente${guessed > 1 ? 's' : ''} estimée${guessed > 1 ? 's' : ''}
                    au prix catalogue (${money(d.price)}), faute de montant enregistré à l’époque`
                : '';

            const hero = `
              <div class="card hero">
                <div class="hero-main">
                  <div class="cap">Revenus SolRush Plus</div>
                  <div class="amount">${guessed ? '≈ ' : ''}${money(m.all_time)}<i>depuis le début</i></div>
                  <p class="sub" style="margin:10px 0 0">
                    ${m.paid} vente${m.paid > 1 ? 's' : ''} · ${pct(m.paid, s.attempts)} des tentatives
                    aboutissent · ${pct(s.plus, s.accounts)} des comptes ont Plus${missing}
                    ${d.payments ? '' : ' · paiements non configurés sur ce serveur'}
                  </p>
                </div>
                <div class="hero-side">
                  <div><b>${money(m.d30)}</b><small>30 derniers jours</small></div>
                  <div><b>${money(m.d7)}</b><small>7 derniers jours</small></div>
                </div>
              </div>`;

            const tiles = `
              <div class="tiles by4">
                <div class="tile"><b>${live}</b><span>en ligne</span></div>
                <div class="tile"><b>${n0(s.players_7d)}</b><span>joueurs actifs</span><em>7 jours</em></div>
                <div class="tile"><b>${n0(s.accounts)}</b><span>comptes</span><em>+${n0(s.new_7d)} cette semaine</em></div>
                <div class="tile"><b>${n0(s.plus)}</b><span>comptes Plus</span></div>
                <div class="tile"><b>${n0(s.games_1d)}</b><span>parties 24 h</span><em>${n0(s.games_7d)} sur 7 j</em></div>
                <div class="tile"><b>${n0(s.games_all)}</b><span>parties au total</span></div>
                <div class="tile ${s.pending ? 'alert' : ''}"><b>${n0(s.pending)}</b><span>paiements en attente</span></div>
                <div class="tile"><b>${n0(s.attempts)}</b><span>tentatives d’achat</span></div>
              </div>`;

            /* Two different questions, kept apart because they get confused:
               how long a GAME lasts, and how long a PERSON stays. Most of the
               time spent here is not spent playing. */
            const engagement = `
              <div class="tiles by3">
                <div class="tile"><b>${dur(t.med_game)}</b><span>durée d’une partie</span><em>médiane</em></div>
                <div class="tile"><b>${dur(t.avg_game)}</b><span>durée d’une partie</span><em>moyenne</em></div>
                <div class="tile"><b>${dur(ses.avg_day)}</b><span>temps par joueur</span><em>et par jour</em></div>
                <div class="tile"><b>${dur(t.played_7d)}</b><span>temps joué</span><em>7 jours</em></div>
                <div class="tile"><b>${dur(t.played_all)}</b><span>temps joué</span><em>depuis le début</em></div>
                <div class="tile"><b>${s.players_7d ? (s.games_7d / s.players_7d).toFixed(1) : '—'}</b>
                    <span>parties par joueur</span><em>7 jours</em></div>
              </div>
              <p class="sub" style="margin:10px 2px 0">
                Durée d’une partie mesurée du début à la fin ; au-delà de deux heures,
                c’est un onglet oublié et la partie est écartée du calcul.
                Le temps par joueur vient du navigateur, qui ne compte que les secondes
                où la page est réellement à l’écran —
                ${ses.device_days ? `${n0(ses.device_days)} journée${ses.device_days > 1 ? 's' : ''}-joueur
                   mesurée${ses.device_days > 1 ? 's' : ''} sur 30 jours`
                    : 'aucune mesure pour l’instant : la mesure démarre au prochain déploiement'}.
              </p>`;

            const onlineRows = d.online.map((p) => `
              <tr>
                <td data-label="Joueur"><span class="dot ${p.away ? 'away' : ''}"></span>
                    <span class="who">${esc(p.nick)}</span>
                    ${p.plus ? ' <span class="pill plus">Plus</span>' : ''}</td>
                <td data-label="Compte">${p.account ? 'inscrit' : '<span class="sub">invité</span>'}</td>
                <td data-label="Points">${n0(p.points)}</td>
                <td data-label="État">${p.away ? '<span class="sub">déconnecté</span>'
                    : p.playing ? `en partie <span class="sub">${esc(p.room || '')}</span>`
                        : p.room ? `salon <span class="sub">${esc(p.room)}</span>` : 'dans les menus'}</td>
              </tr>`).join('');

            const cartRows = d.carts.map((c) => {
                const [cls, label] = CART[c.status] || ['wait', c.status];
                return `<tr>
                  <td data-label="Joueur"><span class="who">${esc(c.nick)}</span>
                      <div class="sub">${esc(c.email)}</div></td>
                  <td data-label="Montant">${c.amount ? money(c.amount) : '<span class="sub">—</span>'}</td>
                  <td data-label="État"><span class="pill ${cls}">${label}</span>
                      ${c.plus ? ' <span class="pill plus">Plus</span>' : ''}</td>
                  <td data-label="Créé">${when(c.created_at)}</td>
                  <td>${c.status === 'waiting_payment'
                        ? `<button data-cart="${esc(c.cart_id)}">Vérifier</button>` : ''}</td>
                </tr>`;
            }).join('');

            const matchRows = d.matches.map((m2) => {
                const secs = m2.started_at && m2.ended_at
                    ? (new Date(m2.ended_at) - new Date(m2.started_at)) / 1000 : 0;
                return `<tr>
                  <td data-label="Partie"><span class="who">${esc(m2.p0_nick)}</span>
                      <span class="sub">contre</span> ${esc(m2.p1_nick)}
                      <div class="sub">${esc(m2.mode)} · ${m2.moves} coups · ${esc(m2.reason || '')}</div></td>
                  <td data-label="Durée">${secs > 0 && secs < 7200 ? dur(secs) : '—'}</td>
                  <td data-label="Fin">${when(m2.ended_at)}</td>
                  <td>${m2.token ? `<a href="/r/${esc(m2.token)}">revoir ↗</a>` : ''}</td>
                </tr>`;
            }).join('');

            $('panel').innerHTML = `
              <section>
                <div class="sec-head"><h2>Argent</h2></div>
                ${hero}
              </section>

              <section>
                <div class="sec-head"><h2>Activité</h2></div>
                ${tiles}
              </section>

              <section id="chart-sec">${chart(d.series)}</section>

              <section>
                <div class="sec-head"><h2>Temps passé</h2></div>
                ${engagement}
              </section>

              <section>
                <div class="sec-head"><h2>En ligne maintenant</h2>
                  <span class="note">${live} actif${live > 1 ? 's' : ''}${d.online.length > live
                    ? ` · ${d.online.length - live} en reconnexion` : ''}</span></div>
                <div class="card">
                  ${onlineRows ? `<table><thead><tr><th>Joueur</th><th>Compte</th><th>Points</th><th>État</th></tr></thead>
                    <tbody>${onlineRows}</tbody></table>`
                    : '<p class="empty">Personne de connecté.</p>'}
                </div>
              </section>

              <section>
                <div class="sec-head"><h2>Chercher un joueur</h2></div>
                <div class="card">
                  <div class="row"><input id="q" placeholder="email ou pseudo" autocomplete="off">
                    <button class="solid" id="go">Chercher</button></div>
                  <div id="found"></div>
                </div>
              </section>

              <section>
                <div class="sec-head"><h2>Paiements</h2>
                  <span class="note">${m.paid} payé${m.paid > 1 ? 's' : ''} · ${s.pending} en attente</span></div>
                <div class="card">
                  ${cartRows ? `<table><thead><tr><th>Joueur</th><th>Montant</th><th>État</th><th>Créé</th><th></th></tr></thead>
                    <tbody>${cartRows}</tbody></table>`
                    : '<p class="empty">Aucune tentative d’achat pour l’instant.</p>'}
                </div>
              </section>

              <section>
                <div class="sec-head"><h2>Dernières parties</h2></div>
                <div class="card">
                  ${matchRows ? `<table><thead><tr><th>Partie</th><th>Durée</th><th>Fin</th><th></th></tr></thead>
                    <tbody>${matchRows}</tbody></table>`
                    : '<p class="empty">Aucune partie terminée.</p>'}
                </div>
              </section>`;

            $('live').hidden = false;
            $('refreshed').textContent = new Date().toLocaleTimeString('fr');
            $('q').value = typed;
            $('found').innerHTML = results;
            if (wasFocused) $('q').focus();
            $('go').addEventListener('click', search);
            $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
            for (const b of $('found').querySelectorAll('[data-user]')) {
                b.addEventListener('click', () => togglePlus(b));
            }
            for (const b of $('panel').querySelectorAll('[data-cart]')) {
                b.addEventListener('click', () => recheck(b));
            }
            wireSeg(d);
        }

        /* The chart redraws its own markup — including these buttons — so they
           are wired again after every redraw. Only the chart is replaced and
           not the page: re-rendering everything would wipe whatever is half
           typed in the search box, which the fifteen-second refresh made a real
           annoyance the first time it happened. */
        function wireSeg(d) {
            for (const b of $('seg').querySelectorAll('[data-metric]')) {
                b.onclick = () => {
                    metric = b.dataset.metric;
                    $('chart-sec').innerHTML = chart(d.series);
                    wireSeg(d);
                };
            }
        }

        async function search() {
            const term = $('q').value.trim();
            const box = $('found');
            if (term.length < 2) { box.innerHTML = '<p class="empty">Au moins deux caractères.</p>'; return; }
            box.innerHTML = '<p class="empty">…</p>';
            const r = await post('/api/admin/players', { q: term });
            if (!r.ok) { box.innerHTML = '<p class="empty">Recherche impossible.</p>'; return; }
            const { rows } = await r.json();
            if (!rows.length) { box.innerHTML = '<p class="empty">Personne trouvé.</p>'; return; }
            box.innerHTML = `<table style="margin-top:12px"><tbody>${rows.map((u) => `
              <tr>
                <td data-label="Joueur"><span class="who">${esc(u.nick)}</span>
                    ${u.plus ? ' <span class="pill plus">Plus</span>' : ''}
                    <div class="sub">${esc(u.email)}</div>
                    <div class="sub">${n0(u.points)} pts · ${u.wins} V / ${u.losses} D · vu ${when(u.last_seen)}</div></td>
                <td><button data-user="${esc(u.id)}" data-on="${u.plus ? '0' : '1'}">
                    ${u.plus ? 'Retirer Plus' : 'Donner Plus'}</button></td>
              </tr>`).join('')}</tbody></table>`;
            for (const b of box.querySelectorAll('[data-user]')) {
                b.addEventListener('click', () => togglePlus(b));
            }
        }

        async function togglePlus(btn) {
            const on = btn.dataset.on === '1';
            if (!confirm(on ? 'Donner SolRush Plus à ce joueur ?' : 'Retirer SolRush Plus à ce joueur ?')) return;
            btn.disabled = true;
            const r = await post('/api/admin/plus', { id: btn.dataset.user, on });
            btn.disabled = false;
            if (!r.ok) { btn.textContent = 'échec'; return; }
            search();       // re-read rather than patch the row by hand
            load();         // the counters moved too
        }

        async function recheck(btn) {
            btn.disabled = true;
            btn.textContent = '…';
            const r = await post('/api/admin/cart', { cart: btn.dataset.cart });
            const out = await r.json().catch(() => ({}));
            if (!r.ok) { btn.disabled = false; btn.textContent = out.error || 'échec'; return; }
            load();
        }

        async function load() {
            if (!session?.access_token) {
                return gate('Connecte-toi d’abord sur SolRush, avec le compte administrateur.');
            }
            const r = await post('/api/admin/overview');
            if (r.status === 403) {
                return gate('Ce compte n’a pas accès à l’administration. '
                    + 'Vérifie ADMIN_EMAILS sur le serveur.');
            }
            if (r.status === 401) return gate('Session expirée. Reconnecte-toi sur SolRush.');
            if (!r.ok) return gate('Le serveur n’a pas répondu.');
            $('gate').hidden = true;
            $('panel').hidden = false;
            render(await r.json());
        }

        load();
        /* Who is online changes by the second, and this page is most useful
           when it is left open on a phone while something is being watched.
           Fifteen seconds is often enough to be live and rare enough not to
           matter. */
        setInterval(load, 15000);
    </script>
</body>

</html>
