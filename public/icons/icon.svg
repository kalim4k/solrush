<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>SolRush</title>
  <!--
    The mark, redrawn flat.

    The app icon is a 3D render, and a 3D render at 16 pixels is a smudge — the
    pawns and the walls stop being separate objects somewhere around 40px. This
    is the same idea reduced to what survives: a wall straight across the middle
    with a pawn shut on either side of it. Three shapes, and the whole game.

    Two things were learned the hard way. A tilted wall plus a pawn touching it
    fuses into one silhouette that reads as a key, so the bar is level and every
    shape keeps clear air around it. And the pawns are drawn as heads only —
    the base of a pawn is the first thing to disappear when the image is a
    dozen pixels tall, and half a pawn reads worse than a circle.

    Sampled from the artwork so the two never drift apart:
      board  #3e4459   walls  #cb8626 → #fbd77c
      violet #9a79e1   amber  #fac558   ground #171e2d
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbd77c"/>
      <stop offset="1" stop-color="#cb8626"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#171e2d"/>
  <!-- the board, inset so the dark ground reads as a rim at any size -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#3e4459"/>

  <!-- the wall: level, full width, and the heaviest thing in the frame -->
  <rect x="6" y="28" width="52" height="8" fill="url(#wall)"/>

  <!-- one pawn on each side, clear of the wall by three pixels at this scale -->
  <circle cx="21" cy="16.5" r="8.5" fill="#9a79e1"/>
  <circle cx="43" cy="47.5" r="8.5" fill="#fac558"/>
</svg>
